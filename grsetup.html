<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЦЕНТРСВЕТ — God Rays</title>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.1/build/index.js",
      "three-good-godrays": "https://cdn.jsdelivr.net/npm/three-good-godrays@0.12.1/build/three-good-godrays.esm.js",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm"
    }
  }
  </script>
</head>

<body>
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer, RenderPass } from 'postprocessing';
import { GodraysPass } from 'three-good-godrays';
import GUI from 'lil-gui';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  45,
  innerWidth / innerHeight,
  0.1,
  5000
);

camera.position.set(0, 0, 1000);

const topCamera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.1,
  5000
);

topCamera.position.set(0, 1500, 0);
topCamera.lookAt(0, 0, 0);

let activeCamera = camera;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

controls.enableZoom = false;
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;

controls.minAzimuthAngle = -THREE.MathUtils.degToRad(30);
controls.maxAzimuthAngle = THREE.MathUtils.degToRad(30);

controls.minPolarAngle =
  Math.PI / 2 - THREE.MathUtils.degToRad(30);

controls.maxPolarAngle =
  Math.PI / 2 + THREE.MathUtils.degToRad(30);

controls.target.set(0, 0, 0);
controls.update();

const params = {
  textSize: 150,
  textDepth: 35,

  lightColor: '#ffb27a',
  lightIntensity: 120000,
  lightDistance: 4000,
  lightX: 0,
  lightY: 0,
  lightZ: -500,

  tubeRadius: 90,
  tubeLength: 180,
  tubeVisible: false,

  shadowMapSize: 2048,
  shadowBias: -0.0005,

  density: 1 / 90,
  maxDensity: 0.75,
  edgeStrength: 3,
  edgeRadius: 2,
  distanceAttenuation: 1.5,
  raymarchSteps: 60,
  blur: true,
  gammaCorrection: true,

  topLightColor: '#ffffff',
  topLightIntensity: 150000,
  topLightDistance: 3000
};

const light = new THREE.PointLight(
  params.lightColor,
  params.lightIntensity,
  params.lightDistance
);

light.position.set(
  params.lightX,
  params.lightY,
  params.lightZ
);

light.castShadow = true;

light.shadow.mapSize.set(
  params.shadowMapSize,
  params.shadowMapSize
);

light.shadow.camera.near = 1;
light.shadow.camera.far = 2000;
light.shadow.bias = params.shadowBias;

scene.add(light);

const topLight = new THREE.PointLight(
  params.topLightColor,
  params.topLightIntensity,
  params.topLightDistance
);

topLight.position.copy(topCamera.position);
topLight.visible = false;

scene.add(topLight);

let tube;
let tubeBack;
let text;
let composer;
let renderPass;
let godraysPass;

function createTube() {
  if (tube) {
    scene.remove(tube);
    tube.geometry.dispose();
    tube.material.dispose();
  }

  if (tubeBack) {
    scene.remove(tubeBack);
    tubeBack.geometry.dispose();
    tubeBack.material.dispose();
  }

  tube = new THREE.Mesh(
    new THREE.CylinderGeometry(
      params.tubeRadius,
      params.tubeRadius,
      params.tubeLength,
      64,
      1,
      true
    ),
    new THREE.MeshStandardMaterial({
      color: 0x000000,
      roughness: 1,
      metalness: 0,
      side: THREE.DoubleSide
    })
  );

  tube.rotation.x = Math.PI / 2;
  tube.position.copy(light.position);
  tube.position.z -= params.tubeLength / 2;
  tube.castShadow = true;
  tube.receiveShadow = true;
  tube.visible = params.tubeVisible;

  scene.add(tube);

  tubeBack = new THREE.Mesh(
    new THREE.CircleGeometry(params.tubeRadius, 64),
    new THREE.MeshStandardMaterial({
      color: 0x000000,
      roughness: 1,
      metalness: 0,
      side: THREE.DoubleSide
    })
  );

  tubeBack.rotation.x = Math.PI / 2;
  tubeBack.position.copy(light.position);
  tubeBack.position.z -= params.tubeLength;
  tubeBack.castShadow = true;
  tubeBack.receiveShadow = true;
  tubeBack.visible = params.tubeVisible;

  scene.add(tubeBack);
}

function rebuildText() {
  if (text) {
    scene.remove(text);
    text.geometry.dispose();
    text.material.dispose();
  }

  const geometry = new TextGeometry('ЦЕНТРСВЕТ', {
    font: window.loadedFont,
    size: params.textSize,
    depth: params.textDepth,
    curveSegments: 16,
    bevelEnabled: true,
    bevelThickness: 6,
    bevelSize: 3,
    bevelSegments: 6
  });

  geometry.center();

  const material = new THREE.MeshBasicMaterial({
    color: 0x000000
  });

  text = new THREE.Mesh(geometry, material);
  text.castShadow = true;
  text.receiveShadow = true;

  scene.add(text);
}

function updateLight() {
  light.color.set(params.lightColor);
  light.intensity = params.lightIntensity;
  light.distance = params.lightDistance;

  light.position.set(
    params.lightX,
    params.lightY,
    params.lightZ
  );

  light.shadow.mapSize.set(
    params.shadowMapSize,
    params.shadowMapSize
  );

  light.shadow.bias = params.shadowBias;
  light.shadow.camera.far = params.lightDistance;
  light.shadow.camera.updateProjectionMatrix();

  createTube();
}

function updateTopLight() {
  topLight.color.set(params.topLightColor);
  topLight.intensity = params.topLightIntensity;
  topLight.distance = params.topLightDistance;
  topLight.position.copy(topCamera.position);
}

function updateTopCamera() {
  topCamera.aspect = innerWidth / innerHeight;
  topCamera.updateProjectionMatrix();
  topLight.position.copy(topCamera.position);
}

function updateGodrays() {
  if (!composer || !godraysPass) return;

  composer.removePass(godraysPass);
  godraysPass.dispose();

  godraysPass = new GodraysPass(light, activeCamera, {
    density: params.density,
    maxDensity: params.maxDensity,
    edgeStrength: params.edgeStrength,
    edgeRadius: params.edgeRadius,
    distanceAttenuation: params.distanceAttenuation,
    color: new THREE.Color(params.lightColor),
    raymarchSteps: params.raymarchSteps,
    blur: params.blur,
    gammaCorrection: params.gammaCorrection
  });

  godraysPass.renderToScreen = true;
  composer.addPass(godraysPass);
}

function switchCamera() {
  if (activeCamera === camera) {
    activeCamera = topCamera;
    topLight.visible = true;
    controls.enabled = false;
  } else {
    activeCamera = camera;
    topLight.visible = false;
    controls.enabled = true;
  }

  renderPass.camera = activeCamera;

  if (godraysPass) {
    composer.removePass(godraysPass);
    godraysPass.dispose();

    godraysPass = new GodraysPass(light, activeCamera, {
      density: params.density,
      maxDensity: params.maxDensity,
      edgeStrength: params.edgeStrength,
      edgeRadius: params.edgeRadius,
      distanceAttenuation: params.distanceAttenuation,
      color: new THREE.Color(params.lightColor),
      raymarchSteps: params.raymarchSteps,
      blur: params.blur,
      gammaCorrection: params.gammaCorrection
    });

    godraysPass.renderToScreen = true;
    composer.addPass(godraysPass);
  }
}

function setupGUI() {
  const gui = new GUI({ title: 'God Rays' });

  gui.add({ switchCamera }, 'switchCamera').name('Switch Camera');

  const textFolder = gui.addFolder('Text');

  textFolder
    .add(params, 'textSize', 10, 500, 1)
    .onFinishChange(rebuildText);

  textFolder
    .add(params, 'textDepth', 1, 200, 1)
    .onFinishChange(rebuildText);

  const lightFolder = gui.addFolder('Light');

  lightFolder
    .addColor(params, 'lightColor')
    .onChange(updateLight);

  lightFolder
    .add(params, 'lightIntensity', 0, 200000, 1000)
    .onChange(updateLight);

  lightFolder
    .add(params, 'lightDistance', 100, 10000, 100)
    .onChange(updateLight);

  lightFolder
    .add(params, 'lightX', -1500, 1500, 1)
    .onChange(updateLight);

  lightFolder
    .add(params, 'lightY', -1500, 1500, 1)
    .onChange(updateLight);

  lightFolder
    .add(params, 'lightZ', -3000, 1000, 1)
    .onChange(updateLight);

  lightFolder
    .add(params, 'shadowMapSize', [512, 1024, 2048, 4096])
    .onChange(updateLight);

  lightFolder
    .add(params, 'shadowBias', -0.01, 0.01, 0.00001)
    .onChange(updateLight);

  const tubeFolder = gui.addFolder('Light Tube');

  tubeFolder
    .add(params, 'tubeRadius', 20, 300, 1)
    .onFinishChange(createTube);

  tubeFolder
    .add(params, 'tubeLength', 20, 500, 1)
    .onFinishChange(createTube);

  tubeFolder
    .add(params, 'tubeVisible')
    .onChange(createTube);

  const topLightFolder = gui.addFolder('Top Camera Light');

  topLightFolder
    .addColor(params, 'topLightColor')
    .onChange(updateTopLight);

  topLightFolder
    .add(params, 'topLightIntensity', 0, 300000, 1000)
    .onChange(updateTopLight);

  topLightFolder
    .add(params, 'topLightDistance', 100, 5000, 100)
    .onChange(updateTopLight);

  const raysFolder = gui.addFolder('God Rays');

  raysFolder
    .add(params, 'density', 0, 0.05, 0.0001)
    .onFinishChange(updateGodrays);

  raysFolder
    .add(params, 'maxDensity', 0, 2, 0.01)
    .onFinishChange(updateGodrays);

  raysFolder
    .add(params, 'edgeStrength', 0, 10, 0.1)
    .onFinishChange(updateGodrays);

  raysFolder
    .add(params, 'edgeRadius', 0, 10, 0.1)
    .onFinishChange(updateGodrays);

  raysFolder
    .add(params, 'distanceAttenuation', 0, 10, 0.1)
    .onFinishChange(updateGodrays);

  raysFolder
    .add(params, 'raymarchSteps', 10, 120, 1)
    .onFinishChange(updateGodrays);

  raysFolder
    .add(params, 'blur')
    .onFinishChange(updateGodrays);

  raysFolder
    .add(params, 'gammaCorrection')
    .onFinishChange(updateGodrays);

  gui.close();
}

new FontLoader().load('./Montserrat.typeface.json', font => {
  window.loadedFont = font;

  rebuildText();
  createTube();
  updateTopCamera();
  updateTopLight();

  composer = new EffectComposer(renderer, {
    frameBufferType: THREE.HalfFloatType
  });

  renderPass = new RenderPass(scene, activeCamera);
  composer.addPass(renderPass);

  godraysPass = new GodraysPass(light, activeCamera, {
    density: params.density,
    maxDensity: params.maxDensity,
    edgeStrength: params.edgeStrength,
    edgeRadius: params.edgeRadius,
    distanceAttenuation: params.distanceAttenuation,
    color: new THREE.Color(params.lightColor),
    raymarchSteps: params.raymarchSteps,
    blur: params.blur,
    gammaCorrection: params.gammaCorrection
  });

  godraysPass.renderToScreen = true;
  composer.addPass(godraysPass);

  setupGUI();

  function animate() {
    requestAnimationFrame(animate);

    controls.update();
    composer.render();
  }

  animate();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  updateTopCamera();

  renderer.setSize(innerWidth, innerHeight);
  composer?.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
