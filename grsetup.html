<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЦЕНТРСВЕТ — God Rays</title>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.1/build/index.js",
      "three-good-godrays": "https://cdn.jsdelivr.net/npm/three-good-godrays@0.12.1/build/three-good-godrays.esm.js",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20/+esm"
    }
  }
  </script>
</head>

<body>
<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer, RenderPass } from 'postprocessing';
import { GodraysPass } from 'three-good-godrays';
import GUI from 'lil-gui';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 0, 1000);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = false;
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minAzimuthAngle = -THREE.MathUtils.degToRad(30);
controls.maxAzimuthAngle = THREE.MathUtils.degToRad(30);
controls.minPolarAngle = Math.PI / 2 - THREE.MathUtils.degToRad(30);
controls.maxPolarAngle = Math.PI / 2 + THREE.MathUtils.degToRad(30);
controls.target.set(0, 0, 0);
controls.update();

const params = {
  textSize: 150,
  textDepth: 35,

  lightColor: '#ffb27a',
  lightIntensity: 150,
  lightX: 0,
  lightY: 0,
  lightZ: -500,

  spotAngle: 28,
  spotPenumbra: 0.45,
  spotDistance: 3000,
  spotDecay: 1,

  shadowMapSize: 2048,
  shadowBias: -0.0005,

  density: 1 / 90,
  maxDensity: 0.75,
  edgeStrength: 3,
  edgeRadius: 2,
  distanceAttenuation: 1.5,
  raymarchSteps: 60,
  blur: true,
  gammaCorrection: true
};

let text;
let composer;
let godraysPass;

const light = new THREE.SpotLight(
  params.lightColor,
  params.lightIntensity,
  params.spotDistance,
  THREE.MathUtils.degToRad(params.spotAngle),
  params.spotPenumbra,
  params.spotDecay
);

light.position.set(params.lightX, params.lightY, params.lightZ);
light.target.position.set(0, 0, 0);
light.castShadow = true;

light.shadow.mapSize.set(params.shadowMapSize, params.shadowMapSize);
light.shadow.camera.near = 1;
light.shadow.camera.far = params.spotDistance;
light.shadow.bias = params.shadowBias;

scene.add(light);
scene.add(light.target);

function rebuildText() {
  if (text) {
    scene.remove(text);
    text.geometry.dispose();
    text.material.dispose();
  }

  const geometry = new TextGeometry('ЦЕНТРСВЕТ', {
    font: window.loadedFont,
    size: params.textSize,
    depth: params.textDepth,
    curveSegments: 16,
    bevelEnabled: true,
    bevelThickness: 6,
    bevelSize: 3,
    bevelSegments: 6
  });

  geometry.center();

  const material = new THREE.MeshBasicMaterial({
    color: 0x000000
  });

  text = new THREE.Mesh(geometry, material);
  text.castShadow = true;
  text.receiveShadow = true;
  scene.add(text);
}

function updateLight() {
  light.color.set(params.lightColor);
  light.intensity = params.lightIntensity;
  light.distance = params.spotDistance;
  light.angle = THREE.MathUtils.degToRad(params.spotAngle);
  light.penumbra = params.spotPenumbra;
  light.decay = params.spotDecay;

  light.position.set(params.lightX, params.lightY, params.lightZ);
  light.target.position.set(0, 0, 0);

  light.shadow.mapSize.set(params.shadowMapSize, params.shadowMapSize);
  light.shadow.camera.far = params.spotDistance;
  light.shadow.bias = params.shadowBias;

  light.shadow.camera.updateProjectionMatrix();
}

function updateGodrays() {
  if (!composer || !godraysPass) return;

  composer.removePass(godraysPass);
  godraysPass.dispose();

  godraysPass = new GodraysPass(light, camera, {
    density: params.density,
    maxDensity: params.maxDensity,
    edgeStrength: params.edgeStrength,
    edgeRadius: params.edgeRadius,
    distanceAttenuation: params.distanceAttenuation,
    color: new THREE.Color(params.lightColor),
    raymarchSteps: params.raymarchSteps,
    blur: params.blur,
    gammaCorrection: params.gammaCorrection
  });

  godraysPass.renderToScreen = true;
  composer.addPass(godraysPass);
}

function setupGUI() {
  const gui = new GUI({ title: 'God Rays' });

  const textFolder = gui.addFolder('Text');
  textFolder.add(params, 'textSize', 10, 500, 1).onFinishChange(rebuildText);
  textFolder.add(params, 'textDepth', 1, 200, 1).onFinishChange(rebuildText);

  const lightFolder = gui.addFolder('Spot Light');

  lightFolder.addColor(params, 'lightColor').onChange(updateLight);
  lightFolder.add(params, 'lightIntensity', 0, 1000, 1).onChange(updateLight);
  lightFolder.add(params, 'lightX', -1500, 1500, 1).onChange(updateLight);
  lightFolder.add(params, 'lightY', -1500, 1500, 1).onChange(updateLight);
  lightFolder.add(params, 'lightZ', -3000, 1000, 1).onChange(updateLight);

  lightFolder.add(params, 'spotAngle', 1, 90, 0.5).onChange(updateLight);
  lightFolder.add(params, 'spotPenumbra', 0, 1, 0.01).onChange(updateLight);
  lightFolder.add(params, 'spotDistance', 100, 5000, 10).onChange(updateLight);
  lightFolder.add(params, 'spotDecay', 0, 2, 0.1).onChange(updateLight);

  lightFolder.add(params, 'shadowMapSize', [512, 1024, 2048, 4096]).onChange(updateLight);
  lightFolder.add(params, 'shadowBias', -0.01, 0.01, 0.00001).onChange(updateLight);

  const raysFolder = gui.addFolder('God Rays');

  raysFolder.add(params, 'density', 0, 0.05, 0.0001).onFinishChange(updateGodrays);
  raysFolder.add(params, 'maxDensity', 0, 2, 0.01).onFinishChange(updateGodrays);
  raysFolder.add(params, 'edgeStrength', 0, 10, 0.1).onFinishChange(updateGodrays);
  raysFolder.add(params, 'edgeRadius', 0, 10, 0.1).onFinishChange(updateGodrays);
  raysFolder.add(params, 'distanceAttenuation', 0, 10, 0.1).onFinishChange(updateGodrays);
  raysFolder.add(params, 'raymarchSteps', 10, 120, 1).onFinishChange(updateGodrays);
  raysFolder.add(params, 'blur').onFinishChange(updateGodrays);
  raysFolder.add(params, 'gammaCorrection').onFinishChange(updateGodrays);

  gui.close();
}

new FontLoader().load('./Montserrat.typeface.json', font => {
  window.loadedFont = font;

  rebuildText();

  composer = new EffectComposer(renderer, {
    frameBufferType: THREE.HalfFloatType
  });

  composer.addPass(new RenderPass(scene, camera));

  godraysPass = new GodraysPass(light, camera, {
    density: params.density,
    maxDensity: params.maxDensity,
    edgeStrength: params.edgeStrength,
    edgeRadius: params.edgeRadius,
    distanceAttenuation: params.distanceAttenuation,
    color: new THREE.Color(params.lightColor),
    raymarchSteps: params.raymarchSteps,
    blur: params.blur,
    gammaCorrection: params.gammaCorrection
  });

  godraysPass.renderToScreen = true;
  composer.addPass(godraysPass);

  setupGUI();

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    composer.render();
  }

  animate();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer?.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
