<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЦЕНТРСВЕТ — God Rays</title>

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>

<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
      "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.1/build/index.js",
      "three-good-godrays": "https://cdn.jsdelivr.net/npm/three-good-godrays@0.12.1/build/three-good-godrays.esm.js"
    }
  }
  </script>
</head>

<body>
<script type="module">
  import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { EffectComposer, RenderPass } from 'postprocessing';
import { GodraysPass } from 'three-good-godrays';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 0, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const light = new THREE.PointLight(0xffaa66, 100000, 3000);
light.position.set(0, 0, -500);
light.castShadow = true;
light.shadow.mapSize.set(2048, 2048);
light.shadow.camera.near = 0.1;
light.shadow.camera.far = 3000;
scene.add(light);

const source = new THREE.Mesh(
  new THREE.SphereGeometry(50, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xffcc88 })
);
source.position.copy(light.position);
scene.add(source);

new FontLoader().load('./Montserrat.typeface.json', font => {
  const geometry = new TextGeometry('ЦЕНТРСВЕТ', {
    font,
    size: 150,
    depth: 30,
    curveSegments: 12,
    bevelEnabled: true,
    bevelThickness: 5,
    bevelSize: 2,
    bevelSegments: 4
  });

  geometry.center();

  const text = new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x331100,
      emissiveIntensity: 1
    })
  );

  text.castShadow = true;
  text.receiveShadow = true;
  scene.add(text);

  const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });

  const renderPass = new RenderPass(scene, camera);
  renderPass.renderToScreen = false;
  composer.addPass(renderPass);

  const godrays = new GodraysPass(light, camera, {
    density: 1 / 128,
    maxDensity: 0.5,
    edgeStrength: 2,
    edgeRadius: 2,
    distanceAttenuation: 2,
    color: new THREE.Color(0xffaa66),
    raymarchSteps: 60,
    blur: true,
    gammaCorrection: true
  });

  godrays.renderToScreen = true;
  composer.addPass(godrays);

  function animate() {
    requestAnimationFrame(animate);
    composer.render();
  }

  animate();
}, undefined, error => {
  console.error('FONT ERROR:', error);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
